 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe | Super Cent 7</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <p class="creator">SUPER CENT 7 PRESENTS</p>

        <h1>Tic Tac Toe</h1>

        <p class="subtitle">The classic game, with a futuristic twist.</p>

        <div class="status" id="status">
            Player X's turn
        </div>

        <div class="board" id="board">

            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>

            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>

            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>

        </div>

        <button class="restart" id="restart">
            Restart Game
        </button>

        <p class="footer">
            Built by <strong>Super Cent 7</strong>
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
